<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0e1520" />
      <stop offset="100%" stop-color="#0e1520" />
    </radialGradient>

    <!-- UI Elements Gradient -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2337" />
      <stop offset="100%" stop-color="#12131d" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 2 5 L 9 8 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 Z" fill="#64748b" />
    </marker>

    <!-- Subtle Dot Pattern for Background -->
    <pattern id="grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />
  <rect width="100%" height="100%" fill="url(#grid-dots)" />

  <!-- Outer Window Frame -->
  <g transform="translate(60, 40)" filter="url(#card-shadow)">
    <title>Two model calls turn pasted text into a script and a storyboard. Local validation and a render worker turn the storyboard into scene clips and a joined video. Everything lands in the project folder.</title>

    <!-- ================= NODES ================= -->

    <!-- Pasted text (Blue) -->
    <g transform="translate(0, 100)">
      <rect width="130" height="44" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="14" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">Pasted text</text>
    </g>

    <!-- Model 1 (Purple) -->
    <g transform="translate(400, 100)">
      <rect width="90" height="44" rx="10" fill="#1e1833" stroke="#a855f7" stroke-width="1.5" filter="url(#glow-purple)"/>
      <text x="14" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">Model</text>
    </g>

    <!-- Script (Blue) -->
    <g transform="translate(700, 100)">
      <rect width="130" height="44" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="14" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">Script</text>
    </g>

    <!-- Model 2 (Purple) -->
    <g transform="translate(720, 270)">
      <rect width="90" height="44" rx="10" fill="#1e1833" stroke="#a855f7" stroke-width="1.5" filter="url(#glow-purple)"/>
      <text x="14" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">Model</text>
    </g>

    <!-- Storyboard (Blue) -->
    <g transform="translate(310, 270)">
      <rect width="150" height="44" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="14" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">Storyboard</text>
    </g>

    <!-- Validation (Blue) -->
    <g transform="translate(310, 440)">
      <rect width="150" height="44" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="14" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">Validation</text>
    </g>

    <!-- Render worker (Blue) -->
    <g transform="translate(620, 440)">
      <rect width="160" height="44" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="14" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">Render worker</text>
    </g>

    <!-- Project folder (Blue) -->
    <g transform="translate(250, 610)">
      <rect width="560" height="64" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="18" y="24" font-size="10" letter-spacing="0.08em" font-family="'JetBrains Mono', monospace" fill="#7dd3fc">PROJECT FOLDER</text>
      <text x="18" y="46" font-size="12" font-family="'JetBrains Mono', monospace" fill="#cbd5e1">input · script · storyboard · narration/ · clips/ · out.mp4</text>
    </g>

    <!-- ================= CONNECTIONS / MESSAGES ================= -->

    <!-- Pasted text -> Model 1 -->
    <g transform="translate(0, 122)">
      <line x1="130" y1="0" x2="400" y2="0" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-right)" />
      <!-- Badge -->
      <g transform="translate(170, -32)">
        <rect width="190" height="28" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">CALL 1</text>
        <text x="70" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">write the script</text>
      </g>
    </g>

    <!-- Model 1 -> Script -->
    <g transform="translate(0, 122)">
      <line x1="490" y1="0" x2="700" y2="0" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-right)" />
      <!-- Badge -->
      <g transform="translate(520, -32)">
        <rect width="140" height="28" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="70" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#a5b4fc">returns a script</text>
      </g>
    </g>

    <!-- Script -> Model 2 -->
    <g transform="translate(0, 144)">
      <line x1="765" y1="0" x2="765" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-down)" />
      <!-- Badge -->
      <g transform="translate(670, 46)">
        <rect width="190" height="28" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">CALL 2</text>
        <text x="70" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">plan the scenes</text>
      </g>
    </g>

    <!-- Model 2 -> Storyboard -->
    <g transform="translate(0, 292)">
      <line x1="720" y1="0" x2="460" y2="0" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-left)" />
      <!-- Badge -->
      <g transform="translate(505, -32)">
        <rect width="170" height="28" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="85" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#a5b4fc">returns a storyboard</text>
      </g>
    </g>

    <!-- Storyboard -> Validation -->
    <g transform="translate(0, 314)">
      <line x1="385" y1="0" x2="385" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-down)" />
      <!-- Badge -->
      <g transform="translate(295, 42)">
        <rect width="180" height="28" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="90" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">schema + scene rules</text>
      </g>
    </g>

    <!-- Validation -> Render worker -->
    <g transform="translate(0, 462)">
      <line x1="460" y1="0" x2="620" y2="0" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-right)" />
      <!-- Badge -->
      <g transform="translate(470, -32)">
        <rect width="150" height="28" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="75" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">render the scenes</text>
      </g>
    </g>

    <!-- Render worker -> Project folder -->
    <g transform="translate(0, 484)">
      <line x1="700" y1="0" x2="700" y2="126" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-down)" />
      <!-- Badge -->
      <g transform="translate(600, 46)">
        <rect width="200" height="28" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="100" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#7dd3fc">scene clips + joined video</text>
      </g>
    </g>

  </g>
</svg>

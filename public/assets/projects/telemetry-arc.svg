<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0e1520" />
      <stop offset="100%" stop-color="#0e1520" />
    </radialGradient>

    <!-- UI Elements Gradient -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2337" />
      <stop offset="100%" stop-color="#12131d" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 5 8 L 8 1 Z" fill="#64748b" />
    </marker>

    <!-- Subtle Dot Pattern for Background -->
    <pattern id="grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />
  <rect width="100%" height="100%" fill="url(#grid-dots)" />

  <!-- Outer Window Frame -->
  <g transform="translate(60, 40)" filter="url(#card-shadow)">
    <!-- ================= NODES ================= -->
    
    <!-- client (Purple) -->
    <g transform="translate(40, 100)">
      <rect width="140" height="44" rx="10" fill="#1e1833" stroke="#a855f7" stroke-width="1.5" filter="url(#glow-purple)"/>
      <rect x="14" y="14" width="16" height="16" rx="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.2" />
      <path d="M 22 20 L 25 22 L 22 24" fill="none" stroke="#e0e7ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="40" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">client</text>
    </g>

    <!-- nginx (Blue) -->
    <g transform="translate(380, 100)">
      <rect width="140" height="44" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="50" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">nginx</text>
    </g>

    <!-- ingestion-service (x3) (Blue) -->
    <g transform="translate(620, 100)">
      <rect width="200" height="44" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="10" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">ingestion-service (x3)</text>
    </g>

    <!-- Kafka (Blue) -->
    <g transform="translate(350, 260)">
      <rect width="320" height="44" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="10" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">Kafka (1 broker, 6 partitions)</text>
    </g>

    <!-- processor-service (x3) (Blue) -->
    <g transform="translate(390, 420)">
      <rect width="240" height="44" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="10" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">processor-service (x3)</text>
    </g>

    <!-- PostgreSQL 18 (Blue) -->
    <g transform="translate(420, 580)">
      <rect width="180" height="44" rx="10" fill="#0f2438" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-blue)"/>
      <text x="10" y="27" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">PostgreSQL 18</text>
    </g>

    <!-- ================= CONNECTIONS / MESSAGES ================= -->

    <!-- POST /api/v1/metrics -->
    <g transform="translate(0, 122)">
      <line x1="180" y1="0" x2="372" y2="0" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-right)" />
      <!-- Badge -->
      <g transform="translate(190, -32)">
        <rect width="180" height="28" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">POST</text>
        <text x="40" y="18" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">/api/v1/metrics</text>
      </g>
    </g>

    <!-- nginx -> ingestion-service -->
    <line x1="520" y1="122" x2="612" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-right)" />

    <!-- ingestion-service -> Kafka -->
    <g transform="translate(720, 144)">
      <line x1="0" y1="0" x2="-210" y2="110" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />      
      <!-- Badges -->
      <g transform="translate(-100, 50)">
        <rect width="100" height="26" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="50" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">metrics topic</text>
      </g>
    </g>

    <!-- Kafka -> processor-service -->
    <g transform="translate(510, 304)">
      <line x1="0" y1="0" x2="0" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-down)" stroke-dasharray="4,4" />
      
      <!-- Badge -->
      <g transform="translate(-50, 40)">
        <rect width="100" height="26" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="50" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">consume</text>
      </g>
    </g>

    <!-- processor-service -> PostgreSQL -->
    <g transform="translate(510, 464)">
      <line x1="0" y1="0" x2="0" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-down)" />
      
      <!-- Badge -->
      <g transform="translate(-110, 40)">
        <rect width="220" height="26" rx="6" fill="#141724" stroke="#2b314a" stroke-width="1" />
        <text x="110" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#a5b4fc">batched writes (200 rows per call)</text>
      </g>
    </g>

  </g>
</svg>

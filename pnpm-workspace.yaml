# pnpm blocks dependency lifecycle scripts unless each package is approved.
# esbuild and sharp both ship native binaries from their install scripts, so
# without this the install fails in CI with ERR_PNPM_IGNORED_BUILDS.
#
# `allowBuilds` replaced `onlyBuiltDependencies` in pnpm 10.26; the old key is
# ignored from pnpm 11 onward. This key works on 10.26+, 11, and 12.
allowBuilds:
  esbuild: true
  sharp: true
